<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criador de Ilustrações</title>
    <meta name="description" content="Gera várias ilustrações de uma vez a partir de um roteiro." />
    <meta name="theme-color" content="#0F1115" />

    <!-- Tema salvo, aplicado antes de desenhar a tela -->
    <script>
      try { var t = localStorage.getItem('tema'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>

    <!-- Design system André Viana: tokens, componentes e fonte Archivo (public/av) -->
    <link rel="stylesheet" href="/av/av.css" />

    <!-- Tailwind pelo CDN, com o preset do design system -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/av/tailwind.preset.js"></script>
    <script>
      tailwind.config = window.avPreset;
    </script>

    <style>
      body { margin: 0; min-height: 100vh; }
      .loading-placeholder { display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--av-texto-suave); }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
      }
    }
    </script>
  </head>
  <body class="av">
    <div id="root">
      <div class="loading-placeholder">Carregando…</div>
    </div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
